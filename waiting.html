<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styleForm.css">
  <link rel="stylesheet" href="CSS/styleQrCode.css">
  <title>Aguardando Aprovação - Crachá On-line</title>
</head>
<body>
  <div class="container" id="waitingScreen">
    <div class="brand-header">
      <img src="IMG/image.png" alt="Logo da empresa" class="logo-fixa">
    </div>

    <div class="background_form">
      <div class="stepper">
        <div class="step done"><span class="step-dot">✓</span> Solicitar</div>
        <div class="step-line"></div>
        <div class="step active"><span class="step-dot">2</span> Aprovação</div>
        <div class="step-line"></div>
        <div class="step"><span class="step-dot">3</span> Crachá</div>
      </div>

      <h1 class="inter-title">Solicitação enviada!</h1>
      <p class="inter-subtitle" id="waitingStatus">
        Aguardando aprovação da portaria... Mantenha esta tela aberta.
      </p>

      <div class="loader"></div>

      <div class="button-container" style="margin-top: 24px;">
        <button type="button" class="btnVoltar" onclick="window.location.href='home.html'">
          <span class="material-icons">arrow_back</span>
          Voltar para Home
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="JS/qrcode.js" defer></script>
</body>
</html>
