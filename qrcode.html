<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styleForm.css">
  <link rel="stylesheet" href="CSS/styleQrCode.css">
  <title>Solicitar QR Code - Crachá On-line</title>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="IMG/image.png" alt="Logo da empresa" class="logo-fixa">
    </div>

    <div class="background_form">
      <div class="stepper">
        <div class="step active"><span class="step-dot">1</span> Solicitar</div>
        <div class="step-line"></div>
        <div class="step"><span class="step-dot">2</span> Aprovação</div>
        <div class="step-line"></div>
        <div class="step"><span class="step-dot">3</span> Crachá</div>
      </div>

      <h1 class="inter-title">Solicitar QR Code de Acesso</h1>
      <p class="inter-subtitle">Envie um pedido de liberação para a portaria gerar o seu acesso.</p>

      <div class="info-banner">
        <div class="info-banner-item">
          <span class="material-icons">schedule</span>
          <span>Validade de <strong>45 minutos</strong> após a aprovação.</span>
        </div>
        <div class="info-banner-item">
          <span class="material-icons">looks_one</span>
          <span>Código de <strong>uso único</strong> para entrada na portaria.</span>
        </div>
      </div>

      <div class="button-container">
        <button type="button" class="btnSolicitarQR">
          <span class="material-icons">qr_code</span>
          Solicitar QR Code
        </button>

        <button type="button" class="btnVoltar" onclick="window.location.href='home.html'">
          <span class="material-icons">arrow_back</span>
          Voltar ao perfil
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="JS/qrcode.js" defer></script>
</body>
</html>
