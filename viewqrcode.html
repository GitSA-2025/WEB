<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styleForm.css">
  <link rel="stylesheet" href="CSS/styleQrCode.css">
  <title>Crachá QR Code - Crachá On-line</title>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="IMG/image.png" alt="Logo da empresa" class="logo-fixa">
    </div>

    <div class="background_form">
      <div class="stepper">
        <div class="step done"><span class="step-dot">✓</span> Solicitar</div>
        <div class="step-line"></div>
        <div class="step done"><span class="step-dot">✓</span> Aprovação</div>
        <div class="step-line"></div>
        <div class="step active"><span class="step-dot">3</span> Crachá</div>
      </div>

      <span class="status-pill-approved">
        <span class="material-icons" style="font-size: 16px;">check_circle</span>
        Acesso Liberado
      </span>

      <h1 class="inter-title">Seu QR Code está pronto</h1>
      <p class="inter-subtitle" id="qrMessage" style="margin-bottom: 10px;">
        Aproxime o QR Code do leitor na portaria.
      </p>

      <div class="qr-frame">
        <img src="" alt="QR Code" class="qrImage" id="qrImage">
        <div class="timer-badge">
          <span class="material-icons" style="font-size: 16px;">timer</span>
          <span id="qrTimer">Válido por 45:00</span>
        </div>
      </div>

      <div class="button-container">
        <button type="button" class="btnDownloadQR" id="btnDownloadQR">
          <span class="material-icons">download</span>
          Baixar QR Code (PNG)
        </button>

        <button type="button" class="btnVoltar" onclick="window.location.href='home.html'">
          <span class="material-icons">home</span>
          Voltar para Home
        </button>
      </div>
    </div>
  </div>

  <script src="JS/viewqrcode.js" defer></script>
</body>
</html>
