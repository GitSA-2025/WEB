<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styleForm.css">
  <link rel="stylesheet" href="CSS/code-input.css">
  <title>Verificação - Crachá On-line</title>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="IMG/image.png" alt="Logo da empresa" class="logo-fixa">
    </div>

    <div class="background_form">
      <form id="verificationForm">
        <h1 class="inter-title">Verificação de e-mail</h1>
        <p class="inter-subtitle">
          Digite o código de 6 dígitos que enviamos para o seu e-mail.
        </p>

        <div class="code-input">
          <input type="text" maxlength="1" inputmode="numeric" pattern="\d*" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="\d*" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="\d*" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="\d*" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="\d*" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="\d*" />
        </div>

        <button type="submit" name="btnLogin" class="btnLogin">
          <span class="material-icons">verified</span>
          Confirmar código
        </button>

        <div class="row">
          <p class="inter-text">Não recebeu o código?</p>
          <a href="2FA.html" class="inter-linktext">Reenviar código</a>
        </div>
      </form>
    </div>
  </div>

  <script src="JS/code-input.js" defer></script>
  <script src="JS/2FA.js" defer></script>
</body>
</html>
