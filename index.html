<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/styleForm.css">
  <title>Login - Crachá On-line</title>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="IMG/image.png" alt="Logo da empresa" class="logo-fixa">
    </div>

    <div class="background_form">
      <form id="loginForm">
        <h1 class="inter-title">Bem-vindo de volta</h1>
        <p class="inter-subtitle">Entre com sua conta para acessar seu crachá digital.</p>

        <div class="input-group">
          <input type="email" name="useremail" id="useremail" required>
          <label for="useremail" class="input-label">
            <span class="material-icons">mail</span>
            E-mail
          </label>
        </div>

        <div class="input-group">
          <input type="password" name="userpass" id="userpass" required>
          <label for="userpass" class="input-label">
            <span class="material-icons">lock</span>
            Senha
          </label>
          <span class="material-icons toggle-password" id="toggleSenha">visibility_off</span>
        </div>

        <div style="text-align: right;">
          <a href="#" class="resetpass">Esqueci a senha</a>
        </div>

        <button type="submit" name="btnLogin" class="btnLogin">
          <span class="material-icons">login</span>
          Entrar
        </button>

        <div class="row">
          <p class="inter-text">Não tem uma conta?</p>
          <a href="register.html" class="inter-linktext">Cadastre-se</a>
        </div>
      </form>
    </div>
  </div>

  <script src="JS/inputs.js" defer></script>
  <script src="JS/password.js" defer></script>
  <script src="JS/login.js" defer></script>
  <script src="JS/scroll.js" defer></script>
</body>
</html>
